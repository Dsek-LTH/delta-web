services:
  delta-web:
    build:
      dockerfile: Dockerfile.release
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DB_FILE_NAME=file:/data/local.db
    volumes:
      - delta-web-data:/data
    depends_on:
      db-init:
        condition: service_completed_successfully

  db-init:
    build:
      context: .
      dockerfile: Dockerfile.tools
    environment:
      - NODE_ENV=production
      - DB_FILE_NAME=file:/data/local.db
    volumes:
      - delta-web-data:/data
    command: sh -c "bun run migrate && bun run seed"
    restart: "no"

volumes:
  delta-web-data:
